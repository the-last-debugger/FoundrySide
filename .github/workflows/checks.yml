name: checks

# Fast, data-free checks on every push and pull request.
#
# What this does NOT do, deliberately: regenerate the reports. The corpus is third-party data that
# is not committed, so a full regeneration needs a retrieval step and about fifteen minutes. That
# runs locally via `python scripts/verify_all.py --full`, and its transcript is the evidence; CI
# covers the parts that do not need the data.
#
# Resource safeguards live in .github/ci-policy.json and scripts/ci_gate.py: a pause switch, a
# per-run minute ceiling, a per-day run limit and an append-only ledger. Their scope is stated in
# the gate's docstring - they are rails inside this repository, not control over GitHub billing.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time; a new push cancels the superseded run rather than spending minutes
# on a commit nobody is waiting for.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the queue-integrity test resolves cited revisions with git cat-file,
          # which cannot work on the depth-1 clone Actions uses by default.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Resource gate
        id: gate
        run: python scripts/ci_gate.py

      - name: Install dependencies
        if: steps.gate.outputs.paused != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Report the environment
        if: steps.gate.outputs.paused != 'true'
        run: |
          python --version
          python -c "import numpy; print('numpy', numpy.__version__)"

      - name: Test suite
        if: steps.gate.outputs.paused != 'true'
        run: python -m unittest discover -s tests -v

      - name: Bridge consistency
        if: steps.gate.outputs.paused != 'true'
        run: python scripts/collab_check.py

      - name: Verification transcript
        if: steps.gate.outputs.paused != 'true'
        run: python scripts/verify_all.py --ci

      - name: Record the run
        if: steps.gate.outputs.paused != 'true' && success()
        run: python scripts/ci_gate.py --record --note "ci checks for ${{ github.sha }}"
