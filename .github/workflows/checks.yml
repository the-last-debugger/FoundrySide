name: checks

# Fast, data-free checks on every push and pull request.
#
# Two deliberate limits, stated because they are easy to misread:
#
# 1. This does NOT regenerate the research reports. The corpus is third-party data that is not
#    committed, so a full regeneration needs a retrieval step and about fifteen minutes. That runs
#    locally via `python scripts/verify_all.py --full`, and its transcript is the evidence.
# 2. The pause switch in .github/ci-policy.json does NOT gate these checks. There are currently no
#    discretionary scheduled or research jobs for it to pause, so it gates nothing and the
#    essential verification always runs. It exists for the day a discretionary job is added.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch at a time; a new push cancels the superseded run rather than spending minutes
# on a commit nobody is waiting for.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the queue-integrity test resolves cited revisions with git cat-file,
          # which cannot work on the depth-1 clone Actions uses by default.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Resource policy check
        # Advisory only: validates the policy file and reports whether a pause would apply. It does
        # not gate the steps below, because none of them is discretionary.
        run: python scripts/ci_gate.py --advisory

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Report the environment
        run: |
          python --version
          python -c "import numpy; print('numpy', numpy.__version__)"

      - name: Test suite
        run: python -m unittest discover -s tests -v

      - name: Bridge consistency
        run: python scripts/collab_check.py

      - name: Repository audit
        # Cross-document consistency: counts, cited reports, retracted claims, revision reachability,
        # digest freshness and links. Every failure this project kept correcting by hand is one of
        # these, so they run on every push rather than when someone remembers.
        run: python scripts/audit.py

      - name: Verification transcript
        run: python scripts/verify_all.py --ci
